name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No macOS: on a free account its jobs waited up to 15 minutes for a runner and got cancelled.
          # The pmset parsing is tested with faked output, so it runs here too.
          - os: ubuntu-latest
            python: "3.x"
          # ubuntu-latest images no longer have Python 3.9.
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: make test
