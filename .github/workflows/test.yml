name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runners are scarce on free accounts: one job there, the oldest supported Python on Ubuntu.
          - os: macos-latest
            python: "3.x"
          - os: ubuntu-latest
            python: "3.x"
          # ubuntu-latest images no longer have Python 3.9.
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: make test
